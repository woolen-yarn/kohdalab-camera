[package]
name = "camera-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "camera-lab"

[workspace]
members = ["helper-entry"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package.camera-lab]
opt-level = 2

[dependencies]
capability-platform = { version = "0.1.0", path = "platform" }

eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
nusb = "0.2.1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
