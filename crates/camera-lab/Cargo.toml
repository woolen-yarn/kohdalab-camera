[package]
name = "camera-lab"
version = "0.1.12"
edition = "2024"
license = "MIT"
default-run = "camera-lab"

[dependencies]
capability-platform = { version = "0.1.0", path = "../capability-platform" }

eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
nusb = "0.2.1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
input-diagnostics = []
