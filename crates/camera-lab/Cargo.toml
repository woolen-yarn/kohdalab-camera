[package]
name = "camera-lab"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
default-run = "camera-lab"

[dependencies]
capability-platform = { version = "0.1.0", path = "../capability-platform" }
kohdalab-control-protocol = { path = "../kohdalab-control-protocol" }

eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow"] }
nusb = "0.2.1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[features]
input-diagnostics = []
