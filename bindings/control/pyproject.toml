[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kohdalab-control"
version = "1.0.4"
description = "Standard-library client for the KohdaLab Control Protocol"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "KohdaLab"}]

[tool.setuptools]
py-modules = ["kohdalab_control"]

[tool.ruff]
# Keep in sync with RUFF_VERSION in .github/workflows/python-binding-style.yml.
required-version = "==0.13.0"
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "PIE", "S"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
